name: build and publish container

on:
  push:
    branches:
    - main
  workflow_dispatch:

env:
  DOCKER_HUB_ORGANIZATION: ${{ vars.DOCKER_HUB_ORGANIZATION }}
  DOCKER_HUB_REPOSITORY: ogcr-app

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publishing needs the Docker Hub organisation and credentials, which only the upstream
      # repository has. Without them (e.g. on a fork) the image is still built, so the
      # Dockerfile is checked on every push, but not pushed or signed.
      CAN_PUBLISH: ${{ vars.DOCKER_HUB_ORGANIZATION != '' && secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}
    steps:

      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --tag ogcr-app:$GITHUB_SHA

      - name: Publish the Docker image with latest tag
        if: env.CAN_PUBLISH == 'true'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin docker.io
          for tag in $GITHUB_SHA main latest; do
            docker tag ogcr-app:$GITHUB_SHA docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/${{ env.DOCKER_HUB_REPOSITORY }}:$tag
          done
          docker push docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/${{ env.DOCKER_HUB_REPOSITORY }} --all-tags
          echo docker ogcr-app with latest tag done

      - uses: sigstore/cosign-installer@main
        if: env.CAN_PUBLISH == 'true'
      - name: Write signing key to disk (only needed for `cosign sign --key`)
        if: env.CAN_PUBLISH == 'true'
        run: echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
      - name: Sign container image with annotations from our environment
        if: env.CAN_PUBLISH == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --key cosign.key \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/${{ env.DOCKER_HUB_REPOSITORY }}:main
